<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Hitster Català</title>
  <style>
    :root{--fons:#111;--text:#f5f5f5;--suau:#9a9a9a;--accent:#e63946;--pista:#2a2a2a}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{background:var(--fons);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:16px;text-align:center;
         -webkit-tap-highlight-color:transparent;user-select:none}
    h1{margin:0;font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;color:var(--suau);font-weight:600}
    .reproductor{position:relative;width:240px;height:240px}
    svg{position:absolute;inset:0;transform:rotate(-90deg)}
    circle{fill:none;stroke-width:8}
    .pista{stroke:var(--pista)}
    .progres{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
    button{position:absolute;inset:20px;border-radius:50%;border:0;background:var(--accent);color:#fff;
           display:grid;place-items:center;cursor:pointer;transition:transform .1s,opacity .2s}
    button:active{transform:scale(.96)}
    button:disabled{opacity:.35;cursor:default}
    button svg{position:static;transform:none;width:72px;height:72px;fill:#fff}
    .estat{min-height:1.4em;color:var(--suau);font-size:1rem;max-width:320px}
    .repetir{position:static;inset:auto;background:transparent;border:1px solid #444;color:var(--text);
             border-radius:999px;padding:10px 22px;font-size:.95rem;display:none}
    .repetir.visible{display:inline-block}
  </style>
</head>
<body>
  <h1>Hitster Català</h1>

  <div class="reproductor">
    <svg viewBox="0 0 240 240" aria-hidden="true">
      <circle class="pista" cx="120" cy="120" r="114"/>
      <circle class="progres" id="progres" cx="120" cy="120" r="114"/>
    </svg>
    <button id="play" disabled aria-label="Reproduir">
      <svg id="icona" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <div class="estat" id="estat">Carregant…</div>
  <button class="repetir" id="repetir">↺ Tornar a escoltar</button>

  <audio id="audio" preload="auto"></audio>

  <script>
    const ICONA_PLAY  = '<path d="M8 5v14l11-7z"/>';
    const ICONA_PAUSA = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    const R = 114, C = 2 * Math.PI * R;
    const progres = document.getElementById('progres');
    const play = document.getElementById('play');
    const icona = document.getElementById('icona');
    const estat = document.getElementById('estat');
    const repetir = document.getElementById('repetir');
    const audio = document.getElementById('audio');

    progres.style.strokeDasharray = C;
    progres.style.strokeDashoffset = C;

    function error(missatge){
      estat.textContent = missatge;
      play.disabled = true;
    }

    const t = new URLSearchParams(location.search).get('t');

    if (!t || !/^\d+$/.test(t)) {
      error('Escaneja una carta per començar 🎵');
    } else {
      const cb = 'deezer_' + Date.now();
      const s = document.createElement('script');
      const temps = setTimeout(() => error('No s\'ha pogut connectar amb Deezer. Torna-ho a provar.'), 10000);

      window[cb] = track => {
        clearTimeout(temps);
        delete window[cb];
        s.remove();
        if (!track || track.error || !track.preview) {
          error('Aquesta cançó no està disponible 😕');
          return;
        }
        audio.src = track.preview;
        play.disabled = false;
        estat.textContent = 'Toca per escoltar';
      };

      s.onerror = () => { clearTimeout(temps); error('No s\'ha pogut connectar amb Deezer. Comprova la connexió.'); };
      s.src = `https://api.deezer.com/track/${t}?output=jsonp&callback=${cb}`;
      document.head.appendChild(s);
    }

    play.onclick = () => {
      if (audio.paused) {
        audio.play().catch(() => error('No s\'ha pogut reproduir. Torna a escanejar la carta.'));
      } else {
        audio.pause();
      }
    };

    repetir.onclick = () => { audio.currentTime = 0; audio.play(); };

    audio.onplay = () => {
      icona.innerHTML = ICONA_PAUSA;
      play.setAttribute('aria-label', 'Pausa');
      estat.textContent = 'Escoltant…';
      repetir.classList.remove('visible');
    };
    audio.onpause = () => {
      icona.innerHTML = ICONA_PLAY;
      play.setAttribute('aria-label', 'Reproduir');
      if (!audio.ended) estat.textContent = 'En pausa';
    };
    audio.onended = () => {
      estat.textContent = 'De quin any és? 🤔';
      repetir.classList.add('visible');
    };
    audio.ontimeupdate = () => {
      if (audio.duration) progres.style.strokeDashoffset = C * (1 - audio.currentTime / audio.duration);
    };
  </script>
</body>
</html>
